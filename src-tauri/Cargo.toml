[package]
name = "obml-viewer"
version = "1.0.0"
description = "OBML Viewer — Opera Mini saved page viewer"
authors = ["Yohan Tabrez"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "obml_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
